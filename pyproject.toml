[project]
name = "smol-course"
version = "0.1.0"
description = "a smol course on llms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.1.0",
    "huggingface-hub>=0.26.3",
    "lighteval[math]>=0.6.2",
    "ipywidgets>=8.1.5",
    "transformers>=4.46.3",
    "trl>=0.12.1",
    "bitsandbytes>=0.45.0",
    "ipykernel>=6.29.5",
    "accelerate>=1.1.1",
    "loralib>=0.1.2",
    "peft>=0.14.0",
    "tiktoken>=0.9.0",
    "pillow>=11.1.0",
    "opencv-python>=4.11.0.86",
    "distilabel[hf-transformers,instructor,outlines]>=1.5.3",
    "beautifulsoup4>=4.13.3",
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    "smolagents>=1.17.0",
    "duckduckgo-search>=8.0.2",
]

[tool.uv.sources]
lighteval = { git = "https://github.com/huggingface/lighteval.git" }
